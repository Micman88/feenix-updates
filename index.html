<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Feenix Stakeholder Hub</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('feenix-hub-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
:root{
  --bg:#FFFFFF; --soft:#FAF9F5; --border:#E8E6DC; --line:#D4D3D0;
  --text:#141413; --muted:#5F5F5C; --faint:#8C8A82;
  --teal:#0C8B8C; --teal-ink:#0A7273; --teal-soft:#EEF6F6; --sample:#F6EEE6; --sample-ink:#8A5326;
  --serif:'Libre Baskerville',Georgia,serif; --sans:Inter,'Helvetica Neue',Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#141413; --soft:#1B1B19; --border:#2C2B28; --line:#3B3A37;
  --text:#F5F4EF; --muted:#B0AEA5; --faint:#86847C;
  --teal:#3BB8B9; --teal-ink:#5CC8C9; --teal-soft:rgba(59,184,185,.12); --sample:rgba(217,160,110,.16); --sample-ink:#E2B285;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --soft:#1B1B19; --border:#2C2B28; --line:#3B3A37;
  --text:#F5F4EF; --muted:#B0AEA5; --faint:#86847C;
  --teal:#3BB8B9; --teal-ink:#5CC8C9; --teal-soft:rgba(59,184,185,.12); --sample:rgba(217,160,110,.16); --sample-ink:#E2B285;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--teal-ink)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}

/* Header */
header{border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.word{font-family:var(--serif);font-weight:700;letter-spacing:.2em;font-size:19px;text-decoration:none;color:var(--text)}
.word b{color:var(--teal)}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);font-weight:600}
.theme{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.theme:hover{background:var(--soft);color:var(--text)}

main{padding:48px 0 72px;min-height:70vh}
.eyebrow{font-size:13px;color:var(--muted)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,5vw,46px);line-height:1.12;margin:6px 0 14px}
h2{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.25}
.lead{color:var(--muted);max-width:620px;font-size:16.5px}
.sec{margin-top:52px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px}
.sec-head a{font-size:14px;text-decoration:none;font-weight:500}

/* Cards */
.card{display:block;border:1px solid var(--border);border-radius:10px;padding:26px 28px;text-decoration:none;color:inherit;background:var(--bg);transition:border-color .15s}
a.card:hover{border-color:var(--line)}
.meta{font-size:12.5px;color:var(--faint);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meta .t{color:var(--teal-ink);font-weight:600}
.card h3{font-family:var(--serif);font-size:21px;line-height:1.3;margin:8px 0 6px;font-weight:700}
.card.small h3{font-size:17px}
.card .hook{font-family:var(--serif);font-size:clamp(20px,2.6vw,25px);line-height:1.35;margin:12px 0 14px;max-width:640px;padding-left:16px;border-left:3px solid var(--teal)}
.card .quote{font-family:var(--serif);font-style:italic;color:var(--muted);margin-bottom:10px;font-size:16px}
.card p{color:var(--muted);font-size:15px;max-width:680px}
.go{display:inline-flex;gap:6px;margin-top:14px;font-size:14.5px;font-weight:500;color:var(--teal-ink)}
.list{display:grid;gap:12px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-ink);white-space:nowrap}
.pill.grey{background:var(--soft);color:var(--muted);border:1px solid var(--border)}
.pill.sample{background:var(--sample);color:var(--sample-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}

/* Dates */
.dates{border-top:1px solid var(--border)}
.date-row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.date-row b{font-family:var(--serif);font-size:15.5px;font-weight:700}
.date-row .sub{display:block;font-size:12.5px;color:var(--faint)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px;color:var(--muted);text-align:center;font-size:14.5px}
.empty strong{display:block;font-family:var(--serif);font-size:19px;color:var(--text);margin-bottom:4px}

/* Slideshow */
.show{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#1B1B19}
.slides{position:relative;aspect-ratio:16/9}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide img.portrait{object-fit:contain;background:#1B1B19}
.show .cap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;background:var(--bg);border-top:1px solid var(--border)}
.show .cap h3{font-family:var(--serif);font-size:18px;margin:2px 0}
.show .cap p{font-size:13.5px;color:var(--muted)}
.ctrl{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(20,20,19,.55);color:#fff;display:grid;place-items:center;font-size:18px}
.ctrl:hover{background:rgba(20,20,19,.8)}
.ctrl.prev{left:12px}.ctrl.next{right:12px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots button.on{background:#fff}
.slide-cap{position:absolute;left:0;right:0;bottom:0;padding:34px 20px 30px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:13.5px}

/* Gallery + lightbox */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gallery button{border-radius:8px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--border);background:var(--soft)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gallery button:hover img{transform:scale(1.03)}
.lb{position:fixed;inset:0;background:rgba(10,10,10,.92);display:none;z-index:50;align-items:center;justify-content:center;flex-direction:column;padding:24px}
.lb.on{display:flex}
.lb img{max-width:min(1000px,92vw);max-height:76vh;border-radius:6px;object-fit:contain}
.lb .lb-cap{color:#F5F4EF;margin-top:14px;font-size:14.5px;text-align:center}
.lb .lb-n{color:#B0AEA5;font-size:12.5px;margin-top:4px}
.lb .x{position:absolute;top:18px;right:22px;color:#fff;font-size:26px}
.lb .nav{display:flex;gap:16px;margin-top:14px}
.lb .nav button{color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}

/* Long read */
.back{font-size:14px;text-decoration:none;color:var(--muted);display:inline-flex;gap:6px;margin-bottom:22px}
.back:hover{color:var(--text)}
.read{display:grid;grid-template-columns:1fr 220px;gap:56px;align-items:start}
.read article{max-width:680px}
.read article h2{margin:36px 0 12px;font-size:21px}
.read article p{margin-bottom:14px;font-size:16.5px}
.read .quote{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin-bottom:8px}
.toc{position:sticky;top:96px;border-left:1px solid var(--border);padding-left:18px}
.toc h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:10px}
.toc a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:4px 0;line-height:1.4}
.toc a:hover,.toc a.on{color:var(--teal-ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);color:var(--text)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:26px 0 18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;background:var(--bg);color:var(--text);min-width:220px}
.search:focus{outline:none;border-color:var(--teal)}
.weeknav{display:flex;gap:8px;align-items:center}
.weeknav button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.weeknav span{font-size:13.5px;color:var(--muted);min-width:130px;text-align:center}

footer{border-top:1px solid var(--border);padding:24px 0 36px;font-size:13px;color:var(--faint)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--faint)}
.err{border:1px solid #C17F4E;border-radius:10px;padding:20px;background:var(--sample)}

@media (max-width:820px){
  .two,.read{grid-template-columns:1fr;gap:28px}
  .toc{display:none}
  .gallery{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  main{padding:32px 0 56px}
  .bar{height:auto;flex-wrap:wrap;padding-top:12px;padding-bottom:6px;gap:8px}
  nav{order:3;width:calc(100% + 20px);margin:0 -10px}
  .theme{margin-left:auto}
  .card{padding:20px}
  .date-row{grid-template-columns:72px 1fr;}
  .date-row .pill{grid-column:2;justify-self:start}
  .search{margin-left:0;width:100%}
  .slides{aspect-ratio:4/3}
  .show .cap{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="word" href="#/" aria-label="Feenix Stakeholder Hub home">FEEN<b>I</b>X</a>
  <nav aria-label="Main">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/updates" data-nav="updates">Updates</a>
    <a href="#/newsletters" data-nav="newsletters">Newsletters</a>
    <a href="#/linkedin" data-nav="linkedin">LinkedIn</a>
    <a href="#/events" data-nav="events">Dates &amp; events</a>
    <a href="#/clients" data-nav="clients">Clients</a>
  </nav>
  <button class="theme" id="theme" type="button" aria-label="Switch colour mode"></button>
</div></header>

<main><div class="wrap" id="app"><p class="eyebrow">Loading…</p></div></main>

<footer><div class="wrap"><span>Feenix Limited · Stakeholder Hub · Please do not share this link.</span><a href="https://www.feenix.tech" target="_blank" rel="noopener">feenix.tech</a></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" type="button" id="lbX" aria-label="Close">✕</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div><div class="lb-n" id="lbN"></div>
  <div class="nav"><button type="button" id="lbP" aria-label="Previous photo">‹</button><button type="button" id="lbNx" aria-label="Next photo">›</button></div>
</div>

<script>
(function(){
'use strict';
var D=null, app=document.getElementById('app');
var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
var W=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var showTimer=null, weekOffset=0, upFilter='all', upQuery='';

/* ---------- theme ---------- */
var sun='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var moon='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function theme(){var t=document.documentElement.getAttribute('data-theme');return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function paintTheme(){var d=theme()==='dark';var b=document.getElementById('theme');b.innerHTML=d?sun:moon;b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');}
document.getElementById('theme').onclick=function(){var n=theme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('feenix-hub-theme',n);}catch(e){}paintTheme();};
paintTheme();

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pd(s){var p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function fd(s){var p=String(s).split('-');if(p.length===1)return p[0];if(p.length===2)return M[+p[1]-1]+' '+p[0];return (+p[2])+' '+M[+p[1]-1]+' '+p[0];}
function short(s){var p=String(s).split('-');if(p.length<3)return M[+p[1]-1].slice(0,3);return (+p[2])+' '+M[+p[1]-1].slice(0,3);}
function key(s){var p=String(s).split('-');return p[0]+'-'+(p[1]||'01')+'-'+(p[2]||'00');}
function today(){var m=location.search.match(/[?&]today=(\d{4}-\d{2}-\d{2})/);var d=m?pd(m[1]):new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function monday(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function sampleTag(o){return o&&o.sample?'<span class="pill sample" title="Placeholder content: replace before sharing">Sample</span>':'';}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function byDateDesc(a,b){return key(b.date).localeCompare(key(a.date));}
function typeLabel(u){return u.type==='ceo'?'CEO update'+(u.period?' · '+u.period:''):'Announcement';}

/* upcoming dates = key_dates + LinkedIn + future events */
function allDates(){
  var out=[];
  (D.key_dates||[]).forEach(function(k){out.push({date:k.date,title:k.title,type:k.type,tbc:k.date_tbc,sample:k.sample});});
  (D.linkedin||[]).forEach(function(p){out.push({date:p.publish_date,title:p.title,type:'LinkedIn',tbc:p.date_tbc,href:'#/linkedin'});});
  (D.events||[]).forEach(function(e){out.push({date:e.date,title:e.title,type:'Event',href:'#/events/'+e.id});});
  return out.sort(function(a,b){return key(a.date).localeCompare(key(b.date));});
}
function upcoming(n){var t=today();return allDates().filter(function(d){var p=String(d.date).split('-');var end=p.length<3?new Date(+p[0],+p[1],0):pd(d.date);return end>=t;}).slice(0,n||999);}
function dateRow(d){return '<div class="date-row"><b>'+short(d.date)+'</b><span>'+(d.href?'<a href="'+d.href+'" style="color:inherit;text-decoration:none">'+esc(d.title)+'</a>':esc(d.title))+(d.tbc?'<span class="sub">Date to be confirmed</span>':'')+'</span><span>'+sampleTag(d)+' <span class="pill'+(d.tbc?' grey':'')+'">'+esc(d.type)+'</span></span></div>';}

/* ---------- pages ---------- */
function home(){
  var s=D.site||{};
  var ceo=(D.updates||[]).filter(function(u){return u.type==='ceo';}).sort(byDateDesc)[0];
  var nl=(D.newsletters||[]).slice().sort(byDateDesc)[0];
  var t=today(),ws=monday(t),we=add(ws,6);
  var gone=(D.linkedin||[]).filter(function(p){return pd(p.publish_date)<=t;}).sort(function(a,b){return b.publish_date.localeCompare(a.publish_date);});
  var wk=gone.filter(function(p){return pd(p.publish_date)>=ws;});if(!wk.length)wk=gone.slice(0,1);
  var ev=(D.events||[]).slice().sort(byDateDesc).filter(function(e){return e.photos&&e.photos.length;})[0];
  var h='<div class="eyebrow">Welcome</div><h1>'+esc(s.title||'The Feenix Stakeholder Hub')+'</h1><p class="lead">'+esc(s.intro||'')+'</p>';
  if(ceo){h+='<section class="sec"><div class="sec-head"><h2>Latest update</h2><a href="#/updates">All updates</a></div>'+updateCard(ceo,true)+'</section>';}
  if(nl){h+='<section class="sec"><div class="sec-head"><h2>'+esc(s.newsletter_heading||'Worth your five minutes')+'</h2><a href="#/newsletters">All newsletters</a></div>'+newsCard(nl,true)+'</section>';}
  h+='<section class="sec two"><div><div class="sec-head"><h2>'+esc(s.linkedin_heading||'In case you missed it on LinkedIn')+'</h2><a href="#/linkedin">All posts</a></div>'+
     (wk.length?'<div class="list">'+wk.map(function(p){return postCard(p,true);}).join('')+'</div>':'<div class="empty">Nothing posted yet. See Key dates for what is coming.</div>')+
     '</div><div><div class="sec-head"><h2>Key dates</h2><a href="#/events">All dates</a></div><div class="dates">'+(upcoming(4).map(dateRow).join('')||'<div class="empty">No dates yet.</div>')+'</div></div></section>';
  if(ev){h+='<section class="sec"><div class="sec-head"><h2>Event galleries</h2><a href="#/events">All events</a></div>'+slideshow(ev)+'</section>';}
  app.innerHTML=h; startShow();
}
function updateCard(u,big){
  return '<a class="card'+(big?'':' small')+'" href="#/updates/'+esc(u.id)+'"><div class="meta"><span class="t">'+typeLabel(u)+'</span><span>'+fd(u.date)+'</span>'+sampleTag(u)+'</div><h3>'+esc(u.title)+'</h3>'+(u.quote&&big?'<div class="quote">"'+esc(u.quote)+'"</div>':'')+'<p>'+esc(u.summary)+'</p>'+(big?'<span class="go">Read the update <span aria-hidden="true">→</span></span>':'')+'</a>';
}
function newsCard(n,hook){return '<a class="card" href="#/newsletters/'+esc(n.id)+'"><div class="meta"><span class="t">The Feenix Brief · '+esc(n.issue)+'</span><span>'+fd(n.date)+'</span>'+(n.read_time?'<span>'+esc(n.read_time)+' read</span>':'')+sampleTag(n)+'</div>'+(hook&&n.hook?'<div class="hook">'+esc(n.hook)+'</div>':'')+'<h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p><span class="go">Read the issue <span aria-hidden="true">→</span></span></a>';}
function postCard(p,compact){
  var d=pd(p.publish_date);
  return '<div class="card small"><div class="meta"><span class="t">'+esc(p.series)+'</span><span>'+W[d.getDay()]+' '+short(p.publish_date)+'</span>'+(p.date_tbc?'<span class="pill grey">Date TBC</span>':'')+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+(compact?'':' · '+esc(p.format))+'</p>'+(p.post_url?'<a class="go" href="'+esc(p.post_url)+'" target="_blank" rel="noopener">View on LinkedIn ↗</a>':'')+'</div>';
}

function slideshow(ev){
  var ph=ev.photos;
  return '<div class="show" id="show" data-n="'+ph.length+'"><div class="slides">'+ph.map(function(p,i){return '<div class="slide'+(i===0?' on':'')+'"><img src="'+esc(p.src)+'" alt="'+esc(p.caption||ev.title)+'" data-i="'+i+'" loading="'+(i?'lazy':'eager')+'"><div class="slide-cap">'+esc(p.caption||'')+'</div></div>';}).join('')+
    (ph.length>1?'<button class="ctrl prev" type="button" aria-label="Previous photo">‹</button><button class="ctrl next" type="button" aria-label="Next photo">›</button><div class="dots">'+ph.map(function(_,i){return '<button type="button" aria-label="Photo '+(i+1)+'" class="'+(i===0?'on':'')+'" data-d="'+i+'"></button>';}).join('')+'</div>':'')+
    '</div><div class="cap"><div><div class="meta">'+fd(ev.date)+(ev.location?' · '+esc(ev.location):'')+'</div><h3>'+esc(ev.title)+'</h3><p>'+esc(ev.summary||'')+'</p></div><a class="btn" href="#/events/'+esc(ev.id)+'">View gallery →</a></div></div>';
}
function startShow(){
  clearInterval(showTimer);var el=document.getElementById('show');if(!el)return;
  var n=+el.getAttribute('data-n'),i=0;
  Array.prototype.forEach.call(el.querySelectorAll('.slide img'),function(img){img.onload=function(){if(img.naturalHeight>img.naturalWidth)img.classList.add('portrait');};if(img.complete&&img.naturalHeight>img.naturalWidth)img.classList.add('portrait');});
  if(n<2)return;
  function go(k){i=(k+n)%n;Array.prototype.forEach.call(el.querySelectorAll('.slide'),function(s,j){s.classList.toggle('on',j===i);});Array.prototype.forEach.call(el.querySelectorAll('.dots button'),function(s,j){s.classList.toggle('on',j===i);});}
  function play(){clearInterval(showTimer);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;showTimer=setInterval(function(){go(i+1);},5000);}
  el.querySelector('.prev').onclick=function(){go(i-1);play();};
  el.querySelector('.next').onclick=function(){go(i+1);play();};
  Array.prototype.forEach.call(el.querySelectorAll('.dots button'),function(b){b.onclick=function(){go(+b.getAttribute('data-d'));play();};});
  el.addEventListener('mouseenter',function(){clearInterval(showTimer);});
  el.addEventListener('mouseleave',play);
  play();
}

function updatesPage(){
  var list=(D.updates||[]).slice().sort(byDateDesc);
  var h='<h1>Updates</h1><p class="lead">CEO updates and announcements, newest first.</p><div class="filters" role="group" aria-label="Filter updates">'+
    [['all','All'],['ceo','CEO updates'],['announcement','Announcements']].map(function(f){return '<button class="chip" type="button" data-f="'+f[0]+'" aria-pressed="'+(upFilter===f[0])+'">'+f[1]+'</button>';}).join('')+
    '<input class="search" id="q" type="search" placeholder="Search updates" aria-label="Search updates" value="'+esc(upQuery)+'"></div><div class="list" id="ulist"></div>';
  app.innerHTML=h;
  function draw(){
    var q=upQuery.toLowerCase();
    var items=list.filter(function(u){if(upFilter!=='all'&&u.type!==upFilter)return false;if(!q)return true;var hay=[u.title,u.summary,u.quote,(u.body||[]).join(' '),(u.sections||[]).map(function(s){return s.heading+' '+s.paragraphs.join(' ');}).join(' ')].join(' ').toLowerCase();return q.split(/\s+/).every(function(w){return hay.indexOf(w)>-1;});});
    document.getElementById('ulist').innerHTML=items.length?items.map(function(u){return updateCard(u,false);}).join(''):'<div class="empty"><strong>No updates match.</strong>Try another word or filter.</div>';
  }
  Array.prototype.forEach.call(app.querySelectorAll('.chip'),function(c){c.onclick=function(){upFilter=c.getAttribute('data-f');Array.prototype.forEach.call(app.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===c);});draw();};});
  document.getElementById('q').oninput=function(e){upQuery=e.target.value.trim();draw();};
  draw();
}
function longRead(item,backHref,backLabel,metaHtml){
  var secs=item.sections||[];
  var h='<a class="back" href="'+backHref+'">← '+backLabel+'</a><div class="read"><article><div class="meta">'+metaHtml+sampleTag(item)+'</div><h1>'+esc(item.title)+'</h1>'+(item.quote?'<p class="quote">"'+esc(item.quote)+'"</p>':'')+(item.summary&&!secs.length?'<p class="lead">'+esc(item.summary)+'</p>':'');
  if(secs.length){secs.forEach(function(s){h+='<h2 id="s-'+slug(s.heading)+'">'+esc(s.heading)+'</h2>'+s.paragraphs.map(function(p){return '<p>'+esc(p)+'</p>';}).join('');});}
  else{(item.body||[]).forEach(function(p){h+='<p style="margin-top:14px">'+esc(p)+'</p>';});}
  var b=[];if(item.link)b.push('<a class="btn primary" href="'+esc(item.link)+'" target="_blank" rel="noopener">'+esc(item.link_label||'Read more')+' ↗</a>');if(item.pdf)b.push('<a class="btn" href="'+esc(item.pdf)+'" target="_blank" rel="noopener">Download PDF</a>');
  if(b.length)h+='<div class="btns">'+b.join('')+'</div>';
  h+='</article>';
  if(secs.length>2)h+='<aside class="toc" aria-label="In this update"><h4>In this '+(backHref.indexOf('news')>-1?'issue':'update')+'</h4>'+secs.map(function(s){return '<a href="#s-'+slug(s.heading)+'" data-s="s-'+slug(s.heading)+'">'+esc(s.heading)+'</a>';}).join('')+'</aside>';
  h+='</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('.toc a'),function(a){a.onclick=function(e){e.preventDefault();var t=document.getElementById(a.getAttribute('data-s'));if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'});};});
}
function updateDetail(id){var u=(D.updates||[]).filter(function(x){return x.id===id;})[0];if(!u)return notFound();longRead(u,'#/updates','All updates','<span class="t">'+typeLabel(u)+'</span><span>'+fd(u.date)+'</span>');}
function newslettersPage(){
  var list=(D.newsletters||[]).slice().sort(byDateDesc);
  app.innerHTML='<h1>Newsletters</h1><p class="lead">Every issue of The Feenix Brief.</p><div class="list" style="margin-top:28px">'+(list.map(newsCard).join('')||'<div class="empty">No issues yet.</div>')+'</div>';
}
function newsDetail(id){var n=(D.newsletters||[]).filter(function(x){return x.id===id;})[0];if(!n)return notFound();longRead(n,'#/newsletters','All newsletters','<span class="t">The Feenix Brief · '+esc(n.issue)+'</span><span>'+fd(n.date)+'</span>');}

function linkedinPage(){
  var all=(D.linkedin||[]).slice().sort(function(a,b){return a.publish_date.localeCompare(b.publish_date);});
  var t=today(),ws=add(monday(t),7*weekOffset),we=add(ws,6);
  var wk=all.filter(function(p){var d=pd(p.publish_date);return d>=ws&&d<=we;});
  var next=all.filter(function(p){return pd(p.publish_date)>we;});
  var past=all.filter(function(p){return pd(p.publish_date)<monday(t);}).reverse();
  var label=weekOffset===0?'This week':(weekOffset<0?'Earlier week':'Later week');
  var h='<h1>LinkedIn</h1><p class="lead">What is going out on LinkedIn, and what already went out.</p>'+
    '<section class="sec"><div class="sec-head"><h2>'+label+'</h2><div class="weeknav"><button type="button" id="wp" aria-label="Previous week">←</button><span>'+ws.getDate()+' '+M[ws.getMonth()].slice(0,3)+' to '+we.getDate()+' '+M[we.getMonth()].slice(0,3)+'</span><button type="button" id="wn" aria-label="Next week">→</button>'+(weekOffset?'<button type="button" id="w0">Today</button>':'')+'</div></div>'+
    (wk.length?'<div class="list">'+wk.map(function(p){return postCard(p,false);}).join('')+'</div>':'<div class="empty">Nothing scheduled for this week.</div>')+'</section>';
  if(weekOffset===0&&next.length)h+='<section class="sec"><div class="sec-head"><h2>Coming up</h2></div><div class="dates">'+next.map(function(p){return dateRow({date:p.publish_date,title:p.title,type:p.series,tbc:p.date_tbc});}).join('')+'</div></section>';
  if(weekOffset===0&&past.length)h+='<section class="sec"><div class="sec-head"><h2>Earlier posts</h2></div><div class="list">'+past.map(function(p){return postCard(p,false);}).join('')+'</div></section>';
  app.innerHTML=h;
  document.getElementById('wp').onclick=function(){weekOffset--;linkedinPage();};
  document.getElementById('wn').onclick=function(){weekOffset++;linkedinPage();};
  var z=document.getElementById('w0');if(z)z.onclick=function(){weekOffset=0;linkedinPage();};
}
function eventsPage(){
  var t=today();
  var past=(D.events||[]).filter(function(e){return pd(e.date)<t;}).sort(byDateDesc);
  var h='<h1>Dates &amp; events</h1><p class="lead">Key dates ahead, then galleries from past events.</p><section class="sec"><div class="sec-head"><h2>Coming up</h2></div><div class="dates">'+(upcoming().map(dateRow).join('')||'<div class="empty">No upcoming dates.</div>')+'</div></section>';
  h+='<section class="sec"><div class="sec-head"><h2>Event galleries</h2></div>'+(past.length?'<div class="two">'+past.map(function(e){var c=e.photos&&e.photos[0];return '<a class="card" href="#/events/'+esc(e.id)+'" style="padding:0;overflow:hidden">'+(c?'<img src="'+esc(c.src)+'" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block">':'')+'<div style="padding:18px 20px"><div class="meta">'+fd(e.date)+' · '+(e.photos||[]).length+' photos</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.summary||'')+'</p></div></a>';}).join('')+'</div>':'<div class="empty">No events yet.</div>')+'</section>';
  app.innerHTML=h;
}
var lbPhotos=[],lbI=0;
function eventDetail(id){
  var e=(D.events||[]).filter(function(x){return x.id===id;})[0];if(!e)return notFound();
  lbPhotos=e.photos||[];
  app.innerHTML='<a class="back" href="#/events">← All events</a><div class="meta">'+fd(e.date)+(e.location?' · '+esc(e.location):'')+'</div><h1>'+esc(e.title)+'</h1><p class="lead">'+esc(e.summary||'')+'</p><div class="gallery" style="margin-top:28px">'+lbPhotos.map(function(p,i){return '<button type="button" data-i="'+i+'" aria-label="Open photo '+(i+1)+'"><img src="'+esc(p.src)+'" alt="'+esc(p.caption||'')+'" loading="lazy"></button>';}).join('')+'</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.gallery button'),function(b){b.onclick=function(){openLb(+b.getAttribute('data-i'));};});
}
function openLb(i){lbI=(i+lbPhotos.length)%lbPhotos.length;var p=lbPhotos[lbI];document.getElementById('lbImg').src=p.src;document.getElementById('lbImg').alt=p.caption||'';document.getElementById('lbCap').textContent=p.caption||'';document.getElementById('lbN').textContent=(lbI+1)+' / '+lbPhotos.length;document.getElementById('lb').classList.add('on');document.getElementById('lbX').focus();}
function closeLb(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lbX').onclick=closeLb;
document.getElementById('lbP').onclick=function(){openLb(lbI-1);};
document.getElementById('lbNx').onclick=function(){openLb(lbI+1);};
document.getElementById('lb').onclick=function(e){if(e.target.id==='lb')closeLb();};
document.addEventListener('keydown',function(e){if(!document.getElementById('lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')openLb(lbI-1);if(e.key==='ArrowRight')openLb(lbI+1);});

function clientsPage(){var c=D.clients||{};app.innerHTML='<h1>Clients</h1><div class="empty" style="margin-top:28px"><strong>Coming soon</strong>'+esc(c.message||'')+'</div>';}
function notFound(){app.innerHTML='<h1>Not found</h1><p class="lead">That page does not exist. <a href="#/">Back to the hub</a>.</p>';}

/* ---------- router ---------- */
function route(){
  clearInterval(showTimer);closeLb();
  var h=location.hash.replace(/^#\/?/,'');
  if(/^s-/.test(h))return; /* in-page anchors */
  var parts=h.split('/').filter(Boolean);var sec=parts[0]||'home';
  Array.prototype.forEach.call(document.querySelectorAll('nav a'),function(a){a.classList.toggle('on',a.getAttribute('data-nav')===sec);});
  if(sec!=='linkedin')weekOffset=0;
  if(sec==='home')home();
  else if(sec==='updates')parts[1]?updateDetail(parts[1]):updatesPage();
  else if(sec==='newsletters')parts[1]?newsDetail(parts[1]):newslettersPage();
  else if(sec==='linkedin')linkedinPage();
  else if(sec==='events')parts[1]?eventDetail(parts[1]):eventsPage();
  else if(sec==='clients')clientsPage();
  else notFound();
  var s=document.querySelector('nav a.on');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest',inline:'nearest'});
  window.scrollTo(0,0);
  var title=(app.querySelector('h1')||{}).textContent;document.title=(title&&sec!=='home'?title+' | ':'')+'Feenix Stakeholder Hub';
}
window.addEventListener('hashchange',route);

/* ---------- load ---------- */
(window.HUB_DATA?Promise.resolve(window.HUB_DATA):fetch('hub-content.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('hub-content.json returned '+r.status);return r.json();}))
.then(function(d){D=d;route();})
.catch(function(e){app.innerHTML='<div class="err"><strong>The hub content could not be loaded.</strong><br>Check that hub-content.json is in the same place as index.html. ('+esc(e.message)+')</div>';});
})();
</script>
</body>
